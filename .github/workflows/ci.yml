name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      # Free regression gate on intent extraction: the regex fallback must keep ≥ 20/25 exact.
      - run: npm run eval:intent -w @fpc/api -- --mode=fallback --min-exact=20
      - run: npm run build
      # Uses the runner's preinstalled Google Chrome (playwright.config.ts: channel 'chrome').
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
